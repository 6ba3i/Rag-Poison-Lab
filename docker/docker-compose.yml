services:
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-elasticsearch:8.19.11}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if command -v curl >/dev/null 2>&1; then curl -fsS http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(yellow|green)\"'; elif command -v wget >/dev/null 2>&1; then wget -qO- http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(yellow|green)\"'; else exit 1; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kibana:
    image: ${KIBANA_IMAGE:-kibana:8.19.11}
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "127.0.0.1:11434:11434/tcp"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  ollama_init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh /workspace/docker/scripts/bootstrap_local_models.sh"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-qwen2.5:1.5b}
    volumes:
      - ../docker/scripts:/workspace/docker/scripts:ro
    restart: "no"

  RagPoison:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ragpoison:dev
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.key
        required: false
    depends_on:
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama_init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ../data:/workspace/data
      - ../ml-100:/workspace/ml-100
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OLLAMA_BASE_URL: http://ollama:11434
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8000)); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  indexer:
    profiles: ["indexing"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: ragpoison:dev
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ../data:/workspace/data
      - ../ml-100:/workspace/ml-100
      - ../docker/scripts:/workspace/docker/scripts:ro
      - ../docker/es:/workspace/docker/es:ro
    command:
      - sh
      - -lc
      - |
        python - <<'PY'
        import json
        import time
        import urllib.request

        url = "http://elasticsearch:9200/_cluster/health"
        status = None
        for _ in range(60):
          try:
            with urllib.request.urlopen(url, timeout=2) as response:
              status = json.loads(response.read().decode("utf-8")).get("status")
            if status in {"yellow", "green"}:
              break
          except Exception:
            pass
          time.sleep(2)

        if status not in {"yellow", "green"}:
          raise SystemExit("Elasticsearch did not reach yellow/green health")
        PY
        sh /workspace/docker/scripts/wait-for-es.sh
        python -m api.app.cli.cli index both --es-url http://elasticsearch:9200 --processed-dir /workspace/data/processed
    restart: "no"

volumes:
  es_data:
  ollama_data:
