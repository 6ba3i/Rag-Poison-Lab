[project]
name = "ragpoison-api"
version = "0.1.0"
description = "RAGPoison API service"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "httpx",
  "elasticsearch",
  "pandas",
  "pyarrow",
  "numpy",
  "rich",
  "questionary",
  "typer",
  "python-multipart",
  "orjson",
  "pytest",
  "pytest-asyncio",
  "pytest-xdist",
  "ruff",
  "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
